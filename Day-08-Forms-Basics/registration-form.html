<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <h1>Registration Form</h1>
    
    <form action="/register" method="post">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        
        <br><br>
        
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        
        <br><br>
        
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        
        <br><br>
        
        <label for="confirm-password">Confirm Password:</label>
        <input type="password" id="confirm-password" name="confirm-password" required>
        
        <br><br>
        
        <label for="country">Country:</label>
        <select id="country" name="country">
            <option value="">Select Country</option>
            <option value="us">United States</option>
            <option value="uk">United Kingdom</option>
            <option value="ca">Canada</option>
            <option value="au">Australia</option>
        </select>
        
        <br><br>
        
        <button type="submit">Register</button>
    </form>
    
    <h2>Select Element</h2>
    <p>The select element creates a dropdown list.</p>
    <ul>
        <li><strong>select</strong> - Dropdown container</li>
        <li><strong>option</strong> - Individual options</li>
        <li><strong>value</strong> - Value sent to server</li>
    </ul>
</body>
</html>
