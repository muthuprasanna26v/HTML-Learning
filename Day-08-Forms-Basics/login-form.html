<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
</head>
<body>
    <h1>Login Form</h1>
    
    <form action="/login" method="post">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        
        <br><br>
        
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        
        <br><br>
        
        <button type="submit">Login</button>
        <button type="reset">Reset</button>
    </form>
    
    <h2>Form Attributes</h2>
    <ul>
        <li><strong>action</strong> - URL where form data is sent</li>
        <li><strong>method</strong> - HTTP method (get or post)</li>
        <li><strong>required</strong> - Field must be filled</li>
        <li><strong>type="password"</strong> - Hides text input</li>
    </ul>
</body>
</html>
