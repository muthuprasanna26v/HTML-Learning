<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
</head>
<body>
    <h1>Job Application Form</h1>
    
    <form action="/apply" method="post" enctype="multipart/form-data">
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" required>
        
        <br><br>
        
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        
        <br><br>
        
        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone" required>
        
        <br><br>
        
        <label for="position">Position:</label>
        <select id="position" name="position" required>
            <option value="">Select Position</option>
            <option value="developer">Developer</option>
            <option value="designer">Designer</option>
            <option value="manager">Manager</option>
        </select>
        
        <br><br>
        
        <label for="experience">Years of Experience:</label>
        <input type="number" id="experience" name="experience" min="0" max="50" required>
        
        <br><br>
        
        <label for="resume">Resume (PDF):</label>
        <input type="file" id="resume" name="resume" accept=".pdf" required>
        
        <br><br>
        
        <label for="cover-letter">Cover Letter:</label>
        <textarea id="cover-letter" name="cover-letter" rows="5" cols="40"></textarea>
        
        <br><br>
        
        <label for="expected-salary">Expected Salary:</label>
        <input type="number" id="expected-salary" name="expected-salary" min="0" step="1000">
        
        <br><br>
        
        <label for="start-date">Available Start Date:</label>
        <input type="date" id="start-date" name="start-date">
        
        <br><br>
        
        <button type="submit">Submit Application</button>
    </form>
</body>
</html>
