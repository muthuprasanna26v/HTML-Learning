<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Types</title>
</head>
<body>
    <h1>HTML Input Types</h1>
    
    <form>
        <h2>Text Input</h2>
        <label for="text-input">Text:</label>
        <input type="text" id="text-input" name="text-input">
        
        <br><br>
        
        <h2>Email Input</h2>
        <label for="email-input">Email:</label>
        <input type="email" id="email-input" name="email-input">
        
        <br><br>
        
        <h2>Password Input</h2>
        <label for="password-input">Password:</label>
        <input type="password" id="password-input" name="password-input">
        
        <br><br>
        
        <h2>Number Input</h2>
        <label for="number-input">Number:</label>
        <input type="number" id="number-input" name="number-input" min="0" max="100">
        
        <br><br>
        
        <h2>Date Input</h2>
        <label for="date-input">Date:</label>
        <input type="date" id="date-input" name="date-input">
        
        <br><br>
        
        <h2>Time Input</h2>
        <label for="time-input">Time:</label>
        <input type="time" id="time-input" name="time-input">
        
        <br><br>
        
        <h2>Color Input</h2>
        <label for="color-input">Color:</label>
        <input type="color" id="color-input" name="color-input">
        
        <br><br>
        
        <h2>Range Input</h2>
        <label for="range-input">Range:</label>
        <input type="range" id="range-input" name="range-input" min="0" max="100">
        
        <br><br>
        
        <h2>URL Input</h2>
        <label for="url-input">URL:</label>
        <input type="url" id="url-input" name="url-input">
        
        <br><br>
        
        <h2>Tel Input</h2>
        <label for="tel-input">Telephone:</label>
        <input type="tel" id="tel-input" name="tel-input">
        
        <br><br>
        
        <h2>Search Input</h2>
        <label for="search-input">Search:</label>
        <input type="search" id="search-input" name="search-input">
        
        <br><br>
        
        <button type="submit">Submit</button>
    </form>
</body>
</html>
