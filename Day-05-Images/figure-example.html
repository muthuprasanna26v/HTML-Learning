<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figure and Figcaption</title>
</head>
<body>
    <h1>Figure and Figcaption</h1>
    
    <h2>Basic Figure</h2>
    <figure>
        <img src="https://via.placeholder.com/300" alt="Placeholder image">
        <figcaption>Figure 1: A placeholder image demonstrating the figure element.</figcaption>
    </figure>
    
    <h2>Multiple Images in Figure</h2>
    <figure>
        <img src="https://via.placeholder.com/150" alt="Small placeholder 1">
        <img src="https://via.placeholder.com/150" alt="Small placeholder 2">
        <figcaption>Figure 2: Two placeholder images side by side.</figcaption>
    </figure>
    
    <h2>Figure with Code</h2>
    <figure>
        <pre><code>function hello() {
    console.log("Hello World");
}</code></pre>
        <figcaption>Figure 3: A simple JavaScript function.</figcaption>
    </figure>
    
    <h2>Why Use Figure?</h2>
    <p>The figure element is semantic and groups the image with its caption.</p>
</body>
</html>
