<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
</head>
<body>
    <h1>Image Gallery</h1>
    
    <h2>Simple Gallery</h2>
    <figure>
        <img src="https://via.placeholder.com/200" alt="Gallery image 1 showing a mountain landscape">
        <figcaption>Mountain Landscape</figcaption>
    </figure>
    
    <figure>
        <img src="https://via.placeholder.com/200" alt="Gallery image 2 showing a beach sunset">
        <figcaption>Beach Sunset</figcaption>
    </figure>
    
    <figure>
        <img src="https://via.placeholder.com/200" alt="Gallery image 3 showing a city skyline">
        <figcaption>City Skyline</figcaption>
    </figure>
    
    <figure>
        <img src="https://via.placeholder.com/200" alt="Gallery image 4 showing a forest path">
        <figcaption>Forest Path</figcaption>
    </figure>
    
    <h2>Gallery Best Practices</h2>
    <ul>
        <li>Use descriptive alt text for each image</li>
        <li>Provide captions with figcaption</li>
        <li>Optimize image file sizes</li>
        <li>Use appropriate image dimensions</li>
    </ul>
</body>
</html>
