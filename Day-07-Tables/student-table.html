<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Mark Table</title>
</head>
<body>
    <h1>Student Mark Table</h1>
    
    <table>
        <thead>
            <tr>
                <th scope="col">Student Name</th>
                <th scope="col">Math</th>
                <th scope="col">Science</th>
                <th scope="col">English</th>
                <th scope="col">Total</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alice Williams</td>
                <td>85</td>
                <td>90</td>
                <td>88</td>
                <td>263</td>
            </tr>
            <tr>
                <td>Bob Brown</td>
                <td>78</td>
                <td>82</td>
                <td>75</td>
                <td>235</td>
            </tr>
            <tr>
                <td>Carol Davis</td>
                <td>92</td>
                <td>88</td>
                <td>95</td>
                <td>275</td>
            </tr>
            <tr>
                <td>David Miller</td>
                <td>80</td>
                <td>85</td>
                <td>82</td>
                <td>247</td>
            </tr>
        </tbody>
    </table>
    
    <h2>Table Sections</h2>
    <ul>
        <li><strong>thead</strong> - Table header section</li>
        <li><strong>tbody</strong> - Table body section</li>
        <li><strong>tfoot</strong> - Table footer section</li>
    </ul>
</body>
</html>
