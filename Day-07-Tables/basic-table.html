<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Table</title>
</head>
<body>
    <h1>Basic HTML Table</h1>
    
    <h2>Simple Table</h2>
    <table>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>City</th>
        </tr>
        <tr>
            <td>John Doe</td>
            <td>25</td>
            <td>New York</td>
        </tr>
        <tr>
            <td>Jane Smith</td>
            <td>30</td>
            <td>Los Angeles</td>
        </tr>
        <tr>
            <td>Bob Johnson</td>
            <td>35</td>
            <td>Chicago</td>
        </tr>
    </table>
    
    <h2>Table Elements</h2>
    <ul>
        <li><strong>table</strong> - The table container</li>
        <li><strong>tr</strong> - Table row</li>
        <li><strong>th</strong> - Table header cell</li>
        <li><strong>td</strong> - Table data cell</li>
    </ul>
</body>
</html>
